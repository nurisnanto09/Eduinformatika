<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Berpikir Komputasional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: transparent; }
        .fade-in { animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .grid-cell { width: 60px; height: 60px; border: 2px dashed #cbd5e1; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
    </style>
</head>
<body class="p-4 font-sans h-full">
    <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden flex flex-col md:flex-row h-full min-h-[400px]">
        <!-- Left: Visualization -->
        <div class="md:w-2/3 bg-gray-50 p-8 flex flex-col items-center justify-center relative border-b md:border-b-0 md:border-r border-gray-200">
            
            <h2 class="text-xl font-bold text-gray-800 mb-6 absolute top-6">Misi: Bawa Robot 🤖 ke Bendera 🚩</h2>
            <div class="grid grid-cols-4 gap-2 bg-white p-4 rounded-2xl shadow-sm" id="maze">
                <div class="grid-cell" id="c-0-0">🤖</div><div class="grid-cell" id="c-0-1"></div><div class="grid-cell" id="c-0-2"></div><div class="grid-cell" id="c-0-3"></div>
                <div class="grid-cell" id="c-1-0"></div><div class="grid-cell bg-gray-200 border-none">🧱</div><div class="grid-cell" id="c-1-2"></div><div class="grid-cell" id="c-1-3"></div>
                <div class="grid-cell" id="c-2-0"></div><div class="grid-cell bg-gray-200 border-none">🧱</div><div class="grid-cell" id="c-2-2"></div><div class="grid-cell" id="c-2-3">🚩</div>
            </div>
            <div id="cmd-list" class="mt-6 flex gap-2 h-10 text-xl"></div>
        
        </div>
        
        <!-- Right: Controls -->
        <div class="md:w-1/3 p-6 flex flex-col justify-center bg-white">
            <div class="bg-blue-50 p-5 rounded-2xl border border-blue-100 min-h-[10rem] flex flex-col justify-center mb-6">
                <h3 class="font-bold text-blue-800 text-sm mb-2 uppercase tracking-wider"><i class="fas fa-info-circle mr-1"></i> Status Proses</h3>
                <p id="status-text" class="text-gray-700 font-medium">Program otak robot dengan memberikan urutan perintah! Tekan tombol di bawah untuk menyusun algoritma.</p>
            </div>
            
            <div class="flex flex-col gap-3">
                
            <button onclick="addCmd('kanan')" class="bg-white border-2 border-gray-300 hover:border-blue-500 text-gray-700 font-bold py-3 px-4 rounded-xl shadow-sm">➡️ Gerak Kanan</button>
            <button onclick="addCmd('bawah')" class="bg-white border-2 border-gray-300 hover:border-blue-500 text-gray-700 font-bold py-3 px-4 rounded-xl shadow-sm">⬇️ Gerak Bawah</button>
            <button onclick="runCmd()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-md mt-2"><i class="fas fa-play mr-2"></i>Jalankan Algoritma</button>
            <button onclick="resetMaze()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-xl shadow-sm mt-2">Ulangi</button>
        
            </div>
        </div>
    </div>

    <script>
        const statusText = document.getElementById('status-text');
        
            let cmds = [];
            let rx = 0, ry = 0;
            const cmdListEl = document.getElementById('cmd-list');
            
            function addCmd(dir) {
                if(cmds.length >= 6) return;
                cmds.push(dir);
                cmdListEl.innerHTML += `<span class="bg-blue-100 p-2 rounded-lg fade-in">${dir==='kanan'?'➡️':'⬇️'}</span>`;
                statusText.innerHTML = `Perintah ditambahkan: <b>Gerak ${dir}</b>.`;
            }
            
            async function runCmd() {
                if(cmds.length === 0) { statusText.innerHTML = "Algoritma masih kosong!"; return; }
                statusText.innerHTML = "Mengeksekusi algoritma...";
                
                for(let i=0; i<cmds.length; i++) {
                    document.getElementById(`c-${ry}-${rx}`).innerHTML = '';
                    if(cmds[i] === 'kanan') rx++;
                    if(cmds[i] === 'bawah') ry++;
                    
                    if(rx > 3 || ry > 2 || (rx==1 && ry==1) || (rx==1 && ry==2)) {
                        statusText.innerHTML = "💥 Robot menabrak tembok atau keluar jalur! Algoritma salah.";
                        return;
                    }
                    document.getElementById(`c-${ry}-${rx}`).innerHTML = '🤖';
                    await new Promise(r => setTimeout(r, 600));
                }
                
                if(rx === 3 && ry === 2) {
                    statusText.innerHTML = "🎉 <b>Berhasil!</b> Robot mencapai bendera. Algoritma Anda sempurna!";
                    document.getElementById(`c-${ry}-${rx}`).innerHTML = '🤖🚩';
                } else {
                    statusText.innerHTML = "❌ Robot berhenti sebelum mencapai bendera. Algoritma belum lengkap.";
                }
            }
            
            function resetMaze() {
                cmds = [];
                rx = 0; ry = 0;
                cmdListEl.innerHTML = '';
                document.querySelectorAll('.grid-cell').forEach(el => { if(!el.classList.contains('bg-gray-200')) el.innerHTML = ''; });
                document.getElementById('c-0-0').innerHTML = '🤖';
                document.getElementById('c-2-3').innerHTML = '🚩';
                statusText.innerHTML = "Program ulang otak robot!";
            }
        
    </script>
</body>
</html>
