<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Pseudocode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: transparent; }
        .fade-in { animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .code-line { padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 1.1rem; color: #e2e8f0; transition: all 0.3s; } .active-code { background-color: #3b82f6; font-weight: bold; color: white; }
    </style>
</head>
<body class="p-4 font-sans h-full">
    <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden flex flex-col md:flex-row h-full min-h-[400px]">
        <!-- Left: Visualization -->
        <div class="md:w-2/3 bg-gray-50 p-8 flex flex-col items-center justify-center relative border-b md:border-b-0 md:border-r border-gray-200">
            
            <h2 class="text-xl font-bold text-gray-800 mb-4 absolute top-6">Pseudocode Evaluasi Nilai</h2>
            <div class="bg-gray-800 p-6 rounded-2xl w-full max-w-sm shadow-xl">
                <div id="l-1" class="code-line">INPUT nilai = 80</div>
                <div id="l-2" class="code-line">IF nilai > 75 THEN</div>
                <div id="l-3" class="code-line">&nbsp;&nbsp;PRINT "Lulus"</div>
                <div id="l-4" class="code-line">ELSE</div>
                <div id="l-5" class="code-line">&nbsp;&nbsp;PRINT "Remedial"</div>
                <div id="l-6" class="code-line">END IF</div>
            </div>
            
            <div class="mt-8 p-4 bg-white rounded-xl shadow-inner border border-gray-200 w-full max-w-sm text-center">
                <p class="text-gray-500 font-bold text-sm mb-2">OUTPUT CONSOLE:</p>
                <p id="output-console" class="text-2xl font-black text-green-600 h-10"></p>
            </div>
        
        </div>
        
        <!-- Right: Controls -->
        <div class="md:w-1/3 p-6 flex flex-col justify-center bg-white">
            <div class="bg-blue-50 p-5 rounded-2xl border border-blue-100 min-h-[10rem] flex flex-col justify-center mb-6">
                <h3 class="font-bold text-blue-800 text-sm mb-2 uppercase tracking-wider"><i class="fas fa-info-circle mr-1"></i> Status Proses</h3>
                <p id="status-text" class="text-gray-700 font-medium">Mari kita eksekusi (jalankan) kode semu ini baris demi baris layaknya sebuah komputer.<br><br>Klik <b>Jalankan Baris</b>.</p>
            </div>
            
            <div class="flex flex-col gap-3">
                
            <button onclick="runLine()" id="btn-run" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-4 rounded-xl shadow-md text-lg">Jalankan Baris &rarr;</button>
        
            </div>
        </div>
    </div>

    <script>
        const statusText = document.getElementById('status-text');
        
            let line = 0;
            function runLine() {
                line++;
                document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active-code'));
                
                if(line === 1) {
                    document.getElementById('l-1').classList.add('active-code');
                    statusText.innerHTML = "<b>Baris 1:</b> Sistem menerima memori variabel bernama 'nilai' dengan angka 80.";
                } else if(line === 2) {
                    document.getElementById('l-2').classList.add('active-code');
                    statusText.innerHTML = "<b>Baris 2 (Logika IF):</b> Komputer mengecek, apakah 80 > 75? Jawabannya <b>BENAR (TRUE)</b>.";
                } else if(line === 3) {
                    document.getElementById('l-3').classList.add('active-code');
                    document.getElementById('output-console').innerText = "Lulus 🎉";
                    statusText.innerHTML = "<b>Baris 3:</b> Karena kondisi IF terpenuhi, perintah PRINT dijalankan. Kata 'Lulus' dicetak ke layar!";
                } else if(line === 4) {
                    document.getElementById('l-6').classList.add('active-code');
                    statusText.innerHTML = "<b>Baris 6:</b> Bagian ELSE dilewati (diabaikan) karena kondisi IF sudah terpenuhi. Program selesai.";
                    document.getElementById('btn-run').innerText = "Ulangi Program";
                } else {
                    line = 0;
                    document.getElementById('output-console').innerText = "";
                    document.getElementById('btn-run').innerText = "Jalankan Baris →";
                    statusText.innerHTML = "Program direset. Siap dijalankan kembali.";
                }
            }
        
    </script>
</body>
</html>
