<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Bahasa Pemrograman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: transparent; }
        .fade-in { animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        textarea:focus { outline: none; }
    </style>
</head>
<body class="p-4 font-sans h-full">
    <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden flex flex-col md:flex-row h-full min-h-[400px]">
        <!-- Left: Visualization -->
        <div class="md:w-2/3 bg-gray-50 p-8 flex flex-col items-center justify-center relative border-b md:border-b-0 md:border-r border-gray-200">
            
            <h2 class="text-xl font-bold text-gray-800 mb-4 absolute top-6">Kode Pemrograman Sungguhan</h2>
            <div class="w-full flex flex-col gap-4 mt-6">
                <!-- Fake Editor -->
                <div class="bg-gray-900 rounded-2xl overflow-hidden shadow-xl border border-gray-700">
                    <div class="bg-gray-800 px-4 py-2 flex gap-2">
                        <div class="w-3 h-3 rounded-full bg-red-500"></div><div class="w-3 h-3 rounded-full bg-yellow-500"></div><div class="w-3 h-3 rounded-full bg-green-500"></div>
                    </div>
                    <div class="p-4">
                        <p class="text-blue-400 font-mono text-sm mb-1">// Ubah warna dan teks di bawah!</p>
                        <div class="flex items-center text-gray-100 font-mono text-lg">
                            <span class="text-pink-400">print</span><span class="text-yellow-300">(</span><span class="text-green-300">"</span>
                            <input id="input-text" type="text" value="Halo Dunia!" class="bg-transparent border-b border-gray-600 text-green-300 w-32 focus:border-white">
                            <span class="text-green-300">"</span><span class="text-yellow-300">)</span>
                        </div>
                        <div class="flex items-center text-gray-100 font-mono text-lg mt-2">
                            <span class="text-pink-400">set_color</span><span class="text-yellow-300">(</span><span class="text-green-300">"</span>
                            <select id="input-color" class="bg-transparent border-b border-gray-600 text-green-300 focus:border-white cursor-pointer">
                                <option value="blue" class="text-black">blue</option>
                                <option value="red" class="text-black">red</option>
                                <option value="purple" class="text-black">purple</option>
                            </select>
                            <span class="text-green-300">"</span><span class="text-yellow-300">)</span>
                        </div>
                    </div>
                </div>
                
                <!-- Output Console -->
                <div class="bg-white rounded-2xl p-6 border-2 border-dashed border-gray-300 min-h-[100px] flex items-center justify-center">
                    <h1 id="real-output" class="text-3xl font-black text-gray-300">Output akan muncul di sini</h1>
                </div>
            </div>
        
        </div>
        
        <!-- Right: Controls -->
        <div class="md:w-1/3 p-6 flex flex-col justify-center bg-white">
            <div class="bg-blue-50 p-5 rounded-2xl border border-blue-100 min-h-[10rem] flex flex-col justify-center mb-6">
                <h3 class="font-bold text-blue-800 text-sm mb-2 uppercase tracking-wider"><i class="fas fa-info-circle mr-1"></i> Status Proses</h3>
                <p id="status-text" class="text-gray-700 font-medium">Bahasa pemrograman mengubah teks yang diketik manusia menjadi perintah nyata di komputer.<br><br>Coba ubah teks dan warna pada <i>editor</i>, lalu klik <b>Compile & Run</b>!</p>
            </div>
            
            <div class="flex flex-col gap-3">
                
            <button onclick="runCode()" class="bg-gray-800 hover:bg-black text-white font-bold py-4 px-4 rounded-xl shadow-md text-lg"><i class="fas fa-play mr-2 text-green-400"></i> Compile & Run Code</button>
        
            </div>
        </div>
    </div>

    <script>
        const statusText = document.getElementById('status-text');
        
            function runCode() {
                const txt = document.getElementById('input-text').value;
                const col = document.getElementById('input-color').value;
                
                const out = document.getElementById('real-output');
                out.innerText = txt;
                out.className = `text-4xl font-black fade-in text-${col}-600`;
                
                statusText.innerHTML = `🎉 <b>Berhasil!</b><br>Komputer menerjemahkan kode Anda dan langsung mencetak teks <b>"${txt}"</b> dengan warna <b>${col}</b> di layar!`;
            }
        
    </script>
</body>
</html>
