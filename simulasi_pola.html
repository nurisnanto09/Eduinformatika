<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Pengenalan Pola</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: transparent; }
        .fade-in { animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .shape { font-size: 4rem; display: inline-block; margin: 0 10px; animation: pop 0.3s; } @keyframes pop { 50% {transform: scale(1.2);} }
    </style>
</head>
<body class="p-4 font-sans h-full">
    <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden flex flex-col md:flex-row h-full min-h-[400px]">
        <!-- Left: Visualization -->
        <div class="md:w-2/3 bg-gray-50 p-8 flex flex-col items-center justify-center relative border-b md:border-b-0 md:border-r border-gray-200">
            
            <h2 class="text-xl font-bold text-gray-800 mb-8 absolute top-6">Misi: Temukan Pola (Pattern)</h2>
            <div class="bg-white px-8 py-6 rounded-3xl shadow-sm border border-gray-100 flex items-center justify-center">
                <span class="shape">🍎</span>
                <span class="shape">🍌</span>
                <span class="shape">🍇</span>
                <span class="shape">🍎</span>
                <span class="shape">🍌</span>
                <span class="shape" id="target-shape">❓</span>
            </div>
        
        </div>
        
        <!-- Right: Controls -->
        <div class="md:w-1/3 p-6 flex flex-col justify-center bg-white">
            <div class="bg-blue-50 p-5 rounded-2xl border border-blue-100 min-h-[10rem] flex flex-col justify-center mb-6">
                <h3 class="font-bold text-blue-800 text-sm mb-2 uppercase tracking-wider"><i class="fas fa-info-circle mr-1"></i> Status Proses</h3>
                <p id="status-text" class="text-gray-700 font-medium">Perhatikan deretan buah di samping. Bisakah Anda mengenali <b>polanya</b>?<br><br>Buah apakah yang seharusnya muncul di posisi tanda tanya?</p>
            </div>
            
            <div class="flex flex-col gap-3">
                
            <p class="font-bold text-gray-600 mb-1 text-center">Pilih Lanjutan Pola:</p>
            <div class="flex gap-2">
                <button onclick="check('🍎')" class="flex-1 bg-white border-2 border-gray-300 hover:border-red-400 text-3xl py-4 rounded-xl shadow-sm">🍎</button>
                <button onclick="check('🍌')" class="flex-1 bg-white border-2 border-gray-300 hover:border-yellow-400 text-3xl py-4 rounded-xl shadow-sm">🍌</button>
                <button onclick="check('🍇')" class="flex-1 bg-white border-2 border-gray-300 hover:border-purple-400 text-3xl py-4 rounded-xl shadow-sm">🍇</button>
            </div>
        
            </div>
        </div>
    </div>

    <script>
        const statusText = document.getElementById('status-text');
        
            function check(fruit) {
                const target = document.getElementById('target-shape');
                target.innerHTML = fruit;
                
                if(fruit === '🍇') {
                    statusText.innerHTML = `🎉 <b>Tepat Sekali!</b><br>Anda berhasil mengenali pola berulang: <b>Apel - Pisang - Anggur</b>. Mengenali pola membantu kita menebak masa depan dengan akurat!`;
                    target.classList.add('fade-in');
                } else {
                    statusText.innerHTML = `❌ <b>Salah!</b><br>Pola tidak berlanjut dengan ${fruit}. Coba teliti lagi urutan dari awal.`;
                }
            }
        
    </script>
</body>
</html>
