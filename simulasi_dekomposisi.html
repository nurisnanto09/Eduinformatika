<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Dekomposisi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: transparent; }
        .fade-in { animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .part { font-size: 4rem; position: absolute; transition: all 1s ease-in-out; }
    </style>
</head>
<body class="p-4 font-sans h-full">
    <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden flex flex-col md:flex-row h-full min-h-[400px]">
        <!-- Left: Visualization -->
        <div class="md:w-2/3 bg-gray-50 p-8 flex flex-col items-center justify-center relative border-b md:border-b-0 md:border-r border-gray-200">
            
            <h2 class="text-xl font-bold text-gray-800 mb-6 absolute top-6 z-10">Masalah Kompleks: Membuat Burger</h2>
            <div id="burger-container" class="relative w-64 h-64 flex items-center justify-center">
                <div id="p-bun-top" class="part z-40" style="top: 20px;">🍔</div>
                <div id="p-lettuce" class="part z-30 opacity-0" style="top: 20px;">🥬</div>
                <div id="p-meat" class="part z-20 opacity-0" style="top: 20px;">🥩</div>
                <div id="p-bun-bot" class="part z-10 opacity-0" style="top: 20px;">🥯</div>
            </div>
        
        </div>
        
        <!-- Right: Controls -->
        <div class="md:w-1/3 p-6 flex flex-col justify-center bg-white">
            <div class="bg-blue-50 p-5 rounded-2xl border border-blue-100 min-h-[10rem] flex flex-col justify-center mb-6">
                <h3 class="font-bold text-blue-800 text-sm mb-2 uppercase tracking-wider"><i class="fas fa-info-circle mr-1"></i> Status Proses</h3>
                <p id="status-text" class="text-gray-700 font-medium">Kita memiliki sebuah masalah besar: <b>Membuat Burger</b>. Sulit memahaminya jika dilihat secara utuh.<br>Klik tombol di bawah untuk mendekomposisi!</p>
            </div>
            
            <div class="flex flex-col gap-3">
                
            <button onclick="decompose()" id="btn-dec" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl shadow-md text-lg">🔪 Lakukan Dekomposisi</button>
            <button onclick="reset()" id="btn-res" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-4 rounded-xl shadow-sm mt-2 hidden">Satukan Kembali</button>
        
            </div>
        </div>
    </div>

    <script>
        const statusText = document.getElementById('status-text');
        
            function decompose() {
                document.getElementById('p-bun-top').innerHTML = '🍞';
                document.getElementById('p-bun-top').style.top = '-40px';
                
                document.getElementById('p-lettuce').style.opacity = '1';
                document.getElementById('p-lettuce').style.top = '20px';
                
                document.getElementById('p-meat').style.opacity = '1';
                document.getElementById('p-meat').style.top = '80px';
                
                document.getElementById('p-bun-bot').style.opacity = '1';
                document.getElementById('p-bun-bot').style.top = '140px';
                
                statusText.innerHTML = "<b>Dekomposisi Berhasil!</b><br>Masalah besar 'Membuat Burger' kini terpecah menjadi 4 bagian kecil: Menyiapkan Roti Atas, Sayur, Daging, dan Roti Bawah. Jauh lebih mudah dikerjakan!";
                document.getElementById('btn-dec').classList.add('hidden');
                document.getElementById('btn-res').classList.remove('hidden');
            }
            
            function reset() {
                document.getElementById('p-bun-top').innerHTML = '🍔';
                document.getElementById('p-bun-top').style.top = '20px';
                
                document.getElementById('p-lettuce').style.opacity = '0';
                document.getElementById('p-lettuce').style.top = '20px';
                
                document.getElementById('p-meat').style.opacity = '0';
                document.getElementById('p-meat').style.top = '20px';
                
                document.getElementById('p-bun-bot').style.opacity = '0';
                document.getElementById('p-bun-bot').style.top = '20px';
                
                statusText.innerHTML = "Kembali ke masalah kompleks. Lakukan dekomposisi lagi!";
                document.getElementById('btn-res').classList.add('hidden');
                document.getElementById('btn-dec').classList.remove('hidden');
            }
        
    </script>
</body>
</html>
