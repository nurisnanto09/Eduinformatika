<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Abstraksi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: transparent; }
        .fade-in { animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .map-item { font-size: 3rem; position: absolute; transition: all 0.5s ease; } .line { position: absolute; height: 4px; background: #3b82f6; top: 120px; left: 80px; width: 0; transition: width 1s ease; opacity: 0; z-index: 10; }
    </style>
</head>
<body class="p-4 font-sans h-full">
    <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden flex flex-col md:flex-row h-full min-h-[400px]">
        <!-- Left: Visualization -->
        <div class="md:w-2/3 bg-gray-50 p-8 flex flex-col items-center justify-center relative border-b md:border-b-0 md:border-r border-gray-200">
            
            <h2 class="text-xl font-bold text-gray-800 mb-4 absolute top-6">Misi: Fokus Pada Rute Kereta</h2>
            <div class="relative w-[400px] h-[300px] bg-green-50 rounded-2xl border-4 border-green-200 overflow-hidden" id="map-container">
                <!-- Noise -->
                <div class="map-item noise" style="top: 20px; left: 20px;">🌳</div>
                <div class="map-item noise" style="top: 20px; left: 150px;">☁️</div>
                <div class="map-item noise" style="top: 180px; left: 50px;">🏠</div>
                <div class="map-item noise" style="top: 200px; left: 250px;">🏢</div>
                <div class="map-item noise" style="top: 80px; left: 280px;">🌳</div>
                
                <!-- Core info -->
                <div class="map-item z-20" style="top: 90px; left: 30px;">🚉<p class="text-xs font-bold text-center">St. A</p></div>
                <div class="map-item z-20" style="top: 90px; left: 170px;">🚉<p class="text-xs font-bold text-center">St. B</p></div>
                <div class="map-item z-20" style="top: 90px; left: 310px;">🚉<p class="text-xs font-bold text-center">St. C</p></div>
                
                <!-- Path -->
                <div id="path" class="line"></div>
            </div>
        
        </div>
        
        <!-- Right: Controls -->
        <div class="md:w-1/3 p-6 flex flex-col justify-center bg-white">
            <div class="bg-blue-50 p-5 rounded-2xl border border-blue-100 min-h-[10rem] flex flex-col justify-center mb-6">
                <h3 class="font-bold text-blue-800 text-sm mb-2 uppercase tracking-wider"><i class="fas fa-info-circle mr-1"></i> Status Proses</h3>
                <p id="status-text" class="text-gray-700 font-medium">Peta di samping penuh dengan informasi pohon, awan, dan rumah (noise). Padahal kita hanya butuh <b>Rute Kereta</b>.<br><br>Gunakan Abstraksi untuk menyaring informasi!</p>
            </div>
            
            <div class="flex flex-col gap-3">
                
            <button onclick="applyAbstraction()" id="btn-abs" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl shadow-md text-lg"><i class="fas fa-eye-slash mr-2"></i>Terapkan Abstraksi</button>
            <button onclick="reset()" id="btn-res" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-4 rounded-xl shadow-sm mt-2 hidden">Kembalikan Detail</button>
        
            </div>
        </div>
    </div>

    <script>
        const statusText = document.getElementById('status-text');
        
            function applyAbstraction() {
                document.querySelectorAll('.noise').forEach(el => {
                    el.style.opacity = '0';
                    el.style.transform = 'scale(0)';
                });
                document.getElementById('map-container').classList.remove('bg-green-50', 'border-green-200');
                document.getElementById('map-container').classList.add('bg-white', 'border-gray-200');
                
                const path = document.getElementById('path');
                path.style.opacity = '1';
                path.style.width = '280px';
                
                statusText.innerHTML = "<b>Abstraksi Berhasil!</b><br>Detail tidak penting (pohon, rumah, awan) telah dihilangkan. Kini kita bisa fokus 100% pada inti masalah: Rute Kereta dari Stasiun A ke C.";
                
                document.getElementById('btn-abs').classList.add('hidden');
                document.getElementById('btn-res').classList.remove('hidden');
            }
            
            function reset() {
                document.querySelectorAll('.noise').forEach(el => {
                    el.style.opacity = '1';
                    el.style.transform = 'scale(1)';
                });
                document.getElementById('map-container').classList.add('bg-green-50', 'border-green-200');
                document.getElementById('map-container').classList.remove('bg-white', 'border-gray-200');
                
                const path = document.getElementById('path');
                path.style.opacity = '0';
                path.style.width = '0';
                
                statusText.innerHTML = "Terlalu banyak informasi! Sulit melihat rute keretanya.";
                document.getElementById('btn-res').classList.add('hidden');
                document.getElementById('btn-abs').classList.remove('hidden');
            }
        
    </script>
</body>
</html>
